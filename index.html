<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>DC World Cup 2026 — Watch Party Venues</title>
  <link href="https://unpkg.com/maplibre-gl@4.7.0/dist/maplibre-gl.css" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --green: #1D9E75;
      --green-light: #E1F5EE;
      --green-dark: #0F6E56;
      --blue: #185FA5;
      --blue-light: #E6F1FB;
      --amber: #BA7517;
      --gray: #5F5E5A;
      --gray-light: #F1EFE8;
      --border: #e2e2df;
      --text: #1a1a18;
      --text-muted: #6b6b67;
      --bg: #ffffff;
      --bg-secondary: #f7f6f3;
      --radius: 12px;
      --radius-sm: 8px;
    }

    html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; background: var(--bg-secondary); color: var(--text); }

    /* ── Desktop layout ── */
    .layout {
      position: fixed; left: 0; right: 0; bottom: 0;
      display: flex;
      overflow: hidden;
      top: 0;
    }

    /* ── Sidebar ── */
    #sidebar {
      width: 320px; min-width: 320px;
      background: var(--bg);
      border-right: 1px solid var(--border);
      display: flex; flex-direction: column;
      overflow: hidden; z-index: 100;
    }

    .sidebar-top { padding: 12px 14px 10px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
    .sidebar-count { font-size: 12px; color: var(--text-muted); margin-bottom: 8px; }
    .filter-row { display: flex; gap: 6px; flex-wrap: wrap; }

    /* Match strip */
    #match-strip { background: #1a1a18; color: #fff; padding: 0; overflow: hidden; border-bottom: 1px solid rgba(255,255,255,0.08); width: 100%; }
    #match-strip.hidden { display: none; }
    .match-strip-inner { display: flex; align-items: stretch; overflow-x: auto; scrollbar-width: none; gap: 0; }
    .match-strip-inner::-webkit-scrollbar { display: none; }
    .match-today-label { font-size: 10px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: #1D9E75; padding: 10px 14px; display: flex; align-items: center; white-space: nowrap; border-right: 1px solid rgba(255,255,255,0.08); flex-shrink: 0; }
    .match-item { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-right: 1px solid rgba(255,255,255,0.08); white-space: nowrap; flex-shrink: 0; }
    .match-teams { font-size: 13px; font-weight: 600; color: #fff; }
    .match-teams span { color: rgba(255,255,255,0.4); font-weight: 400; margin: 0 4px; }
    .match-time { font-size: 11px; color: rgba(255,255,255,0.55); }
    .match-channel { font-size: 10px; background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.7); padding: 2px 6px; border-radius: 4px; }
    .match-no-games { font-size: 12px; color: rgba(255,255,255,0.4); padding: 10px 16px; font-style: italic; }
    /* Near me button */
    .near-me-btn { display: flex; align-items: center; gap: 5px; font-size: 12px; padding: 5px 12px; border: 1px solid var(--border); border-radius: 20px; cursor: pointer; background: transparent; color: var(--text-muted); transition: all 0.15s; font-family: inherit; -webkit-tap-highlight-color: transparent; white-space: nowrap; }
    .near-me-btn:hover { border-color: var(--green); color: var(--green); }
    .near-me-btn.active { background: var(--green); color: #fff; border-color: var(--green); }
    .search-wrap { position: relative; margin-bottom: 8px; }
    .search-input { width: 100%; padding: 7px 32px 7px 10px; font-size: 13px; font-family: inherit; border: 1px solid var(--border); border-radius: 20px; background: var(--bg-secondary); color: var(--text); outline: none; transition: border-color 0.15s; }
    .search-input:focus { border-color: var(--green); background: var(--bg); }
    .search-input::placeholder { color: var(--text-muted); }
    .search-clear { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: var(--text-muted); font-size: 16px; line-height: 1; display: none; font-family: inherit; padding: 0; }
    .search-clear.visible { display: block; }
    .empty-state { padding: 32px 16px; text-align: center; color: var(--text-muted); }
    .empty-state-icon { font-size: 28px; margin-bottom: 10px; }
    .empty-state-title { font-size: 14px; font-weight: 500; color: var(--text); margin-bottom: 4px; }
    .empty-state-sub { font-size: 12px; line-height: 1.5; }

    .filter-btn { font-size: 12px; padding: 5px 12px; border: 1px solid var(--border); border-radius: 20px; cursor: pointer; background: transparent; color: var(--text-muted); transition: all 0.15s; font-family: inherit; -webkit-tap-highlight-color: transparent; }
    .filter-btn:hover { border-color: var(--green); color: var(--green); }
    .filter-btn.active { background: var(--green); color: #fff; border-color: var(--green); }

    .legend { display: flex; gap: 12px; flex-wrap: wrap; padding: 8px 14px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
    .legend-item { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--text-muted); }
    .dot { width: 10px; height: 10px; border-radius: 50%; border: 2px solid white; box-shadow: 0 0 0 1px rgba(0,0,0,0.12); flex-shrink: 0; }

    #venue-list { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }

    .venue-card { padding: 12px 14px; cursor: pointer; border-left: 3px solid transparent; border-bottom: 1px solid var(--border); transition: background 0.1s; -webkit-tap-highlight-color: transparent; }
    .venue-card:last-child { border-bottom: none; }
    .venue-card:hover { background: var(--bg-secondary); }
    .venue-card.selected { border-left-color: var(--green); background: var(--green-light); }
    .vc-name { font-size: 14px; font-weight: 600; color: var(--text); margin-bottom: 2px; }
    .vc-hood { font-size: 12px; color: var(--text-muted); margin-bottom: 6px; }
    .vc-tags { display: flex; flex-wrap: wrap; gap: 4px; }
    .tag { font-size: 11px; padding: 2px 8px; border-radius: 20px; font-weight: 500; white-space: nowrap; }
    .tag-team  { background: var(--blue-light); color: var(--blue); }
    .tag-all   { background: var(--green-light); color: var(--green-dark); }
    .tag-hours { background: var(--gray-light); color: var(--gray); }

    /* ── Map ── */
    #map-container { flex: 1; position: relative; }
    #map { width: 100%; height: 100%; }
    .maplibregl-ctrl-attrib { font-size: 10px !important; }

    /* ── Loading ── */
    #loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: var(--bg); z-index: 500; gap: 12px; }
    #loading.hidden { display: none; }
    .spinner { width: 32px; height: 32px; border-radius: 50%; border: 3px solid var(--border); border-top-color: var(--green); animation: spin 0.7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { font-size: 13px; color: var(--text-muted); }

    #error-msg { display: none; padding: 16px; margin: 12px; border-radius: var(--radius-sm); background: #FCEBEB; color: #A32D2D; font-size: 13px; line-height: 1.5; }
    #error-msg.visible { display: block; }

    /* ── Desktop popup ── */
    #popup { position: absolute; bottom: 20px; left: 20px; width: 290px; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; display: none; z-index: 150; box-shadow: 0 4px 24px rgba(0,0,0,0.1); }
    #popup.visible { display: block; }
    .popup-close { position: absolute; top: 10px; right: 10px; background: var(--bg-secondary); border: none; width: 26px; height: 26px; border-radius: 50%; cursor: pointer; font-size: 16px; color: var(--text-muted); display: flex; align-items: center; justify-content: center; font-family: inherit; transition: background 0.15s; }
    .popup-close:hover { background: var(--border); }
    .popup-name { font-size: 15px; font-weight: 700; padding-right: 30px; margin-bottom: 2px; }
    .popup-hood { font-size: 12px; color: var(--text-muted); margin-bottom: 10px; }
    .popup-row { display: flex; gap: 8px; margin-bottom: 7px; font-size: 13px; align-items: flex-start; }
    .popup-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted); min-width: 50px; padding-top: 1px; }
    .popup-val { color: var(--text); line-height: 1.4; }
    .popup-team-badge { display: inline-block; background: var(--blue-light); color: var(--blue); font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 20px; }
    .popup-divider { height: 1px; background: var(--border); margin: 8px 0; }
    .popup-note { font-size: 12px; color: var(--text-muted); line-height: 1.5; background: var(--bg-secondary); padding: 8px 10px; border-radius: var(--radius-sm); }

    /* ── Mobile layout ── */
    #mobile-layout { display: none; flex-direction: column; min-height: 100vh; }

    #mobile-map { width: 100%; height: 60vw; min-height: 260px; max-height: 380px; position: relative; }
    #mobile-map #map-mobile { width: 100%; height: 100%; }

    #mobile-list-section { background: var(--bg); border-top: 1px solid var(--border); }

    .mobile-list-header { padding: 12px 16px 8px; border-bottom: 1px solid var(--border); }
    .mobile-count { font-size: 12px; color: var(--text-muted); margin-bottom: 8px; }
    .mobile-filter-row { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
    .mobile-filter-row::-webkit-scrollbar { display: none; }
    .mobile-filter-row .filter-btn { flex-shrink: 0; }

    #mobile-venue-list { padding: 0; }

    /* Mobile venue detail card */
    #mobile-detail { display: none; position: fixed; left: 0; right: 0; bottom: 0; background: var(--bg); border-radius: 16px 16px 0 0; border-top: 1px solid var(--border); z-index: 400; transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.32,0.72,0,1); padding-bottom: env(safe-area-inset-bottom); }
    #mobile-detail.visible { transform: translateY(0); }
    .detail-header { display: flex; align-items: flex-start; justify-content: space-between; padding: 16px 16px 10px; border-bottom: 1px solid var(--border); }
    .detail-name { font-size: 17px; font-weight: 700; margin-bottom: 2px; }
    .detail-hood { font-size: 13px; color: var(--text-muted); }
    .detail-close { background: var(--bg-secondary); border: none; width: 30px; height: 30px; border-radius: 50%; cursor: pointer; font-size: 18px; color: var(--text-muted); display: flex; align-items: center; justify-content: center; font-family: inherit; flex-shrink: 0; margin-left: 10px; }
    .detail-body { padding: 14px 16px 20px; }
    .detail-row { display: flex; gap: 10px; margin-bottom: 12px; align-items: flex-start; }
    .detail-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted); min-width: 52px; padding-top: 2px; }
    .detail-val { font-size: 14px; color: var(--text); line-height: 1.4; }
    .detail-note { font-size: 13px; color: var(--text-muted); line-height: 1.5; background: var(--bg-secondary); padding: 10px 12px; border-radius: var(--radius-sm); margin-top: 4px; }

    /* ── Responsive switch ── */
    @media (max-width: 680px) {
      .layout { display: none; }
      #mobile-layout { display: flex; }
      #mobile-detail { display: block; }
    }
  </style>
</head>
<body>

<!-- Desktop -->
<div id="match-strip" class="hidden"><div class="match-strip-inner"><div class="match-today-label">Today</div><div id="match-strip-items"></div></div></div>
<div class="layout">
  <div id="sidebar">
    <div class="sidebar-top">
      <div class="search-wrap">
        <input class="search-input" id="search-input" type="text" placeholder="Search venues, neighborhoods, teams…" />
        <button class="search-clear" id="search-clear">×</button>
      </div>
      <div class="sidebar-count" id="venue-count">Loading...</div>
      <div class="filter-row">
        <button class="filter-btn active" data-filter="all">All venues</button>
        <button class="filter-btn" data-filter="team">Team-specific</button>
        <button class="filter-btn" data-filter="usa">🇺🇸 USA bars</button>
        <button class="near-me-btn" id="near-me-btn">📍 Near me</button>
      </div>
    </div>
    <div class="legend">
      <div class="legend-item"><div class="dot" style="background:#1D9E75"></div> Shows all games</div>
      <div class="legend-item"><div class="dot" style="background:#185FA5"></div> One country only</div>
      <div class="legend-item"><div class="dot" style="background:#BA7517"></div> Select matches</div>
    </div>
    <div id="venue-list"><div id="error-msg"></div></div>
  </div>
  <div id="map-container">
    <div id="map"></div>
    <div id="loading"><div class="spinner"></div><div class="loading-text">Loading venues...</div></div>
    <div id="popup">
      <button class="popup-close" id="popup-close">×</button>
      <div class="popup-name" id="popup-name"></div>
      <div class="popup-hood" id="popup-hood"></div>
      <div id="popup-body"></div>
    </div>
  </div>
</div>

<!-- Mobile -->
<div id="mobile-layout">
  <div id="mobile-map">
    <div id="map-mobile"></div>
    <div id="loading-mobile" style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#fff;gap:10px;">
      <div class="spinner"></div>
      <div class="loading-text">Loading venues...</div>
    </div>
  </div>
  <div id="mobile-list-section">
    <div class="mobile-list-header">
      <div class="search-wrap">
        <input class="search-input" id="mobile-search-input" type="text" placeholder="Search venues, neighborhoods, teams…" />
        <button class="search-clear" id="mobile-search-clear">×</button>
      </div>
      <div class="mobile-count" id="mobile-count">Loading...</div>
      <div class="mobile-filter-row">
        <button class="filter-btn active" data-filter="all">All venues</button>
        <button class="filter-btn" data-filter="team">Team-specific</button>
        <button class="filter-btn" data-filter="usa">🇺🇸 USA bars</button>
        <button class="near-me-btn" id="mobile-near-me-btn">📍 Near me</button>
      </div>
    </div>
    <div id="mobile-venue-list"></div>
  </div>
</div>

<!-- Mobile detail sheet -->
<div id="mobile-detail">
  <div class="detail-header">
    <div>
      <div class="detail-name" id="detail-name"></div>
      <div class="detail-hood" id="detail-hood"></div>
    </div>
    <button class="detail-close" id="detail-close">×</button>
  </div>
  <div class="detail-body" id="detail-body"></div>
</div>

<script src="https://unpkg.com/maplibre-gl@4.7.0/dist/maplibre-gl.js"></script>
<script>
  const MATCHES_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRiZIR6IrxHKBHEEy6NJe0JBy8tz7cXV2i9XmUmzsd_Fb71HxEMnEDLcpCxGy9db-u5QNsUOMZbG-I6/pub?gid=903992166&single=true&output=csv";
  const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRiZIR6IrxHKBHEEy6NJe0JBy8tz7cXV2i9XmUmzsd_Fb71HxEMnEDLcpCxGy9db-u5QNsUOMZbG-I6/pub?gid=0&single=true&output=csv";

  let venues = [], desktopMap, mobileMap, desktopMarkers = [], mobileMarkers = [];
  let activeFilter = 'all', selectedIdx = null, searchQuery = '', venuesLoaded = false;
  const isMobile = () => window.innerWidth <= 680;

  function parseCSV(text) {
    const lines = text.trim().split('\n');
    if (lines.length < 2) return [];
    const headers = lines[0].split(',').map(h => h.trim().replace(/^"|"$/g, ''));
    return lines.slice(1).map(line => {
      const fields = [];
      let cur = '', inQuote = false;
      for (let i = 0; i < line.length; i++) {
        if (line[i] === '"') { inQuote = !inQuote; }
        else if (line[i] === ',' && !inQuote) { fields.push(cur.trim()); cur = ''; }
        else { cur += line[i]; }
      }
      fields.push(cur.trim());
      const obj = {};
      headers.forEach((h, i) => { obj[h] = (fields[i] || '').replace(/^"|"$/g, '').trim(); });
      return obj;
    }).filter(r => r.name && r.lat && r.lng).map(r => ({
      name: r.name, neighborhood: r.neighborhood || '',
      lat: parseFloat(r.lat), lng: parseFloat(r.lng),
      hours: r.hours || '', games: r.games || '',
      team: r.team || null, note: r.note || '',
      showAllGames: r.showAllGames ? r.showAllGames.toUpperCase() === 'TRUE' : true,
      usaSpecial: r.usaSpecial ? r.usaSpecial.toUpperCase() === 'TRUE' : false,
    }));
  }

  function markerColor(v) {
    if (v.team) return '#185FA5';
    if (v.showAllGames) return '#1D9E75';
    return '#BA7517';
  }

  function filtered() {
    let base = venues;
    if (activeFilter === 'team') base = base.filter(v => v.team);
    else if (activeFilter === 'usa') base = base.filter(v => v.usaSpecial);
    if (searchQuery) {
      const q = searchQuery.toLowerCase();
      base = base.filter(v =>
        v.name.toLowerCase().includes(q) ||
        v.neighborhood.toLowerCase().includes(q) ||
        (v.team && v.team.toLowerCase().includes(q)) ||
        (v.note && v.note.toLowerCase().includes(q)) ||
        (v.games && v.games.toLowerCase().includes(q))
      );
    }
    return base;
  }

  function makeMarkerEl(color, idx, mapType) {
    const el = document.createElement('div');
    el.style.cssText = `width:14px;height:14px;border-radius:50%;background:${color};border:2.5px solid white;box-shadow:0 1px 6px rgba(0,0,0,0.3);cursor:pointer;transition:transform 0.15s;`;
    el.addEventListener('mouseenter', () => { if (selectedIdx !== idx) el.style.transform = 'scale(1.3)'; });
    el.addEventListener('mouseleave', () => { if (selectedIdx !== idx) el.style.transform = 'scale(1)'; });
    el.addEventListener('click', () => mapType === 'mobile' ? showDetail(idx) : selectVenueDesktop(idx));
    return el;
  }

  function renderMarkers() {
    desktopMarkers.forEach(m => m.remove()); desktopMarkers = [];
    mobileMarkers.forEach(m => m.remove()); mobileMarkers = [];
    filtered().forEach(venue => {
      const idx = venues.indexOf(venue);
      const color = markerColor(venue);
      if (desktopMap) {
        const m = new maplibregl.Marker({ element: makeMarkerEl(color, idx, 'desktop') }).setLngLat([venue.lng, venue.lat]).addTo(desktopMap);
        desktopMarkers.push(m);
      }
      if (mobileMap) {
        const m = new maplibregl.Marker({ element: makeMarkerEl(color, idx, 'mobile') }).setLngLat([venue.lng, venue.lat]).addTo(mobileMap);
        mobileMarkers.push(m);
      }
    });
  }

  function renderLists() {
    const f = filtered();
    const countText = `${f.length} venue${f.length !== 1 ? 's' : ''}`;
    document.getElementById('venue-count').textContent = countText;
    document.getElementById('mobile-count').textContent = countText;

    const desktopList = document.getElementById('venue-list');
    desktopList.innerHTML = '<div id="error-msg"></div>';
    const mobileList = document.getElementById('mobile-venue-list');
    mobileList.innerHTML = '';

    if (f.length === 0) {
      const icon = searchQuery.length > 0 ? '🔍' : '📍';
      const title = searchQuery.length > 0 ? 'No venues found' : 'No venues here';
      const sub = searchQuery.length > 0
        ? 'No results for "' + searchQuery + '" — try a different search or filter'
        : 'Try a different filter';
      const emptyHtml = '<div class="empty-state"><div class="empty-state-icon">' + icon + '</div><div class="empty-state-title">' + title + '</div><div class="empty-state-sub">' + sub + '</div></div>';
      desktopList.innerHTML += emptyHtml;
      mobileList.innerHTML = emptyHtml;
      return;
    }

    f.forEach(venue => {
      const idx = venues.indexOf(venue);
      const teamTag = venue.team ? `<span class="tag tag-team">${venue.team}</span>` : `<span class="tag tag-all">All teams</span>`;
      const inner = `<div class="vc-name">${venue.name}</div><div class="vc-hood">${venue.neighborhood}</div><div class="vc-tags">${teamTag}<span class="tag tag-hours">${venue.hours}</span></div>`;

      [desktopList, mobileList].forEach((list, li) => {
        const card = document.createElement('div');
        card.className = 'venue-card' + (selectedIdx === idx ? ' selected' : '');
        card.dataset.idx = idx;
        card.innerHTML = inner;
        card.addEventListener('click', () => {
          if (li === 1 || isMobile()) {
            mobileMap && mobileMap.flyTo({ center: [venue.lng, venue.lat], zoom: 14, duration: 600 });
            showDetail(idx);
          } else {
            selectVenueDesktop(idx);
          }
        });
        list.appendChild(card);
      });
    });
  }

  function selectVenueDesktop(idx) {
    selectedIdx = idx;
    const v = venues[idx];
    document.querySelectorAll('.venue-card').forEach(c => c.classList.toggle('selected', parseInt(c.dataset.idx) === idx));
    desktopMarkers.forEach((m, i) => {
      const el = m.getElement();
      const isSelected = venues.indexOf(filtered()[i]) === idx;
      el.style.transform = isSelected ? 'scale(1.5)' : 'scale(1)';
      el.style.zIndex = isSelected ? '10' : '1';
    });
    desktopMap && desktopMap.flyTo({ center: [v.lng, v.lat], zoom: 14, duration: 600 });
    document.getElementById('popup-name').textContent = v.name;
    document.getElementById('popup-hood').textContent = v.neighborhood;
    const teamHtml = v.team ? `<span class="popup-team-badge">${v.team}</span>` : `<span style="color:var(--text-muted);font-size:13px;">No specific affiliation</span>`;
    const mapsUrl = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(v.name + ' ' + v.neighborhood + ' Washington DC');
    document.getElementById('popup-body').innerHTML = `
      <div class="popup-row"><span class="popup-label">Hours</span><span class="popup-val">${v.hours}</span></div>
      <div class="popup-row"><span class="popup-label">Games</span><span class="popup-val">${v.games}</span></div>
      <div class="popup-row"><span class="popup-label">Team</span><span class="popup-val">${teamHtml}</span></div>
      <div class="popup-divider"></div>
      <div class="popup-note">${v.note}</div>
      <a href="${mapsUrl}" target="_blank" style="display:inline-flex;align-items:center;gap:5px;margin-top:10px;font-size:12px;color:var(--green);text-decoration:none;font-weight:500;">Open in Google Maps →</a>`;
    document.getElementById('popup').classList.add('visible');
    const card = document.querySelector(`#venue-list .venue-card[data-idx="${idx}"]`);
    if (card) card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  function showDetail(idx) {
    selectedIdx = idx;
    const v = venues[idx];
    document.getElementById('detail-name').textContent = v.name;
    document.getElementById('detail-hood').textContent = v.neighborhood;
    const teamHtml = v.team ? `<span class="popup-team-badge">${v.team}</span>` : `<span style="color:var(--text-muted);font-size:13px;">No specific affiliation</span>`;
    const mapsUrlM = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(v.name + ' ' + v.neighborhood + ' Washington DC');
    document.getElementById('detail-body').innerHTML = `
      <div class="detail-row"><span class="detail-label">Hours</span><span class="detail-val">${v.hours}</span></div>
      <div class="detail-row"><span class="detail-label">Games</span><span class="detail-val">${v.games}</span></div>
      <div class="detail-row"><span class="detail-label">Team</span><span class="detail-val">${teamHtml}</span></div>
      <div class="detail-note">${v.note}</div>
      <a href="${mapsUrlM}" target="_blank" style="display:inline-flex;align-items:center;gap:5px;margin-top:12px;font-size:13px;color:var(--green);text-decoration:none;font-weight:500;">Open in Google Maps →</a>`;
    document.getElementById('mobile-detail').classList.add('visible');
  }

  function hideDetail() {
    document.getElementById('mobile-detail').classList.remove('visible');
    selectedIdx = null;
  }

  function clearSelection() {
    selectedIdx = null;
    document.getElementById('popup').classList.remove('visible');
    document.querySelectorAll('.venue-card').forEach(c => c.classList.remove('selected'));
    desktopMarkers.forEach(m => { m.getElement().style.transform = 'scale(1)'; m.getElement().style.zIndex = '1'; });
  }

  async function loadVenues() {
    try {
      const res = await fetch(SHEET_CSV_URL);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      venues = parseCSV(await res.text());
      if (!venues.length) throw new Error('No venues found.');
      venuesLoaded = true;
      document.getElementById('loading').classList.add('hidden');
      document.getElementById('loading-mobile').style.display = 'none';
      renderMarkers();
      renderLists();
      loadMatches();
    } catch (err) {
      document.getElementById('loading').classList.add('hidden');
      document.getElementById('loading-mobile').style.display = 'none';
      const el = document.getElementById('error-msg');
      el.textContent = `Could not load venues: ${err.message}`;
      el.classList.add('visible');
    }
  }

  function handleSearch(q) {
    searchQuery = q.trim();
    document.getElementById('search-clear').classList.toggle('visible', q.length > 0);
    document.getElementById('mobile-search-clear').classList.toggle('visible', q.length > 0);
    document.getElementById('search-input').value = q;
    document.getElementById('mobile-search-input').value = q;
    clearSelection();
    hideDetail();
    renderMarkers();
    renderLists();
  }

  document.getElementById('search-input').addEventListener('input', e => handleSearch(e.target.value));
  document.getElementById('mobile-search-input').addEventListener('input', e => handleSearch(e.target.value));
  document.getElementById('search-clear').addEventListener('click', () => handleSearch(''));
  document.getElementById('mobile-search-clear').addEventListener('click', () => handleSearch(''));


  // ── Near me ──
  let nearMeActive = false;
  let userLat = null, userLng = null;

  function sortByDistance() {
    if (!userLat || !userLng) return;
    venues.sort((a, b) => {
      const distA = Math.pow(a.lat - userLat, 2) + Math.pow(a.lng - userLng, 2);
      const distB = Math.pow(b.lat - userLat, 2) + Math.pow(b.lng - userLng, 2);
      return distA - distB;
    });
  }

  function activateNearMe() {
    if (!navigator.geolocation) { alert('Geolocation is not supported by your browser.'); return; }
    navigator.geolocation.getCurrentPosition(pos => {
      userLat = pos.coords.latitude;
      userLng = pos.coords.longitude;
      nearMeActive = true;
      document.querySelectorAll('.near-me-btn').forEach(b => b.classList.add('active'));
      sortByDistance();
      const activeMap = isMobile() ? mobileMap : desktopMap;
      if (activeMap) activeMap.flyTo({ center: [userLng, userLat], zoom: 12, duration: 600 });
      renderMarkers();
      renderLists();
    }, () => alert('Could not get your location. Please check your browser permissions.'));
  }

  function deactivateNearMe() {
    nearMeActive = false;
    userLat = null; userLng = null;
    document.querySelectorAll('.near-me-btn').forEach(b => b.classList.remove('active'));
    renderMarkers();
    renderLists();
  }

  document.getElementById('near-me-btn').addEventListener('click', () => nearMeActive ? deactivateNearMe() : activateNearMe());
  document.getElementById('mobile-near-me-btn').addEventListener('click', () => nearMeActive ? deactivateNearMe() : activateNearMe());

  // ── Match strip ──
  async function loadMatches() {
    try {
      const res = await fetch(MATCHES_CSV_URL);
      if (!res.ok) return;
      const text = await res.text();
      const lines = text.trim().split('\n');
      if (lines.length < 2) return;
      const headers = lines[0].split(',').map(h => h.trim().replace(/^"|"$/g, '').toLowerCase());
      const matches = lines.slice(1).map(line => {
        const fields = [];
        let cur = '', inQ = false;
        for (let i = 0; i < line.length; i++) {
          if (line[i] === '"') { inQ = !inQ; }
          else if (line[i] === ',' && !inQ) { fields.push(cur.trim()); cur = ''; }
          else { cur += line[i]; }
        }
        fields.push(cur.trim());
        const obj = {};
        headers.forEach((h, i) => { obj[h] = (fields[i] || '').replace(/^"|"$/g, '').trim(); });
        return obj;
      }).filter(m => m.date && m.home && m.away);

      const today = new Date().toISOString().split('T')[0];
      const todayMatches = matches.filter(m => m.date === today);

      const strip = document.getElementById('match-strip');
      const items = document.getElementById('match-strip-items');

      if (todayMatches.length === 0) {
        const next = matches.find(m => m.date > today);
        if (next) {
          items.innerHTML = '<div class="match-no-games">No games today — next match: ' + next.home + ' vs ' + next.away + ' on ' + next.date + '</div>';
          strip.classList.remove('hidden');
          adjustLayoutForStrip();
        }
        return;
      }

      items.innerHTML = todayMatches.map(m =>
        '<div class="match-item">' +
          '<div class="match-teams">' + m.home + '<span>vs</span>' + m.away + '</div>' +
          (m.time ? '<div class="match-time">' + m.time + '</div>' : '') +
          (m.channel ? '<div class="match-channel">' + m.channel + '</div>' : '') +
        '</div>'
      ).join('');
      strip.classList.remove('hidden');
      adjustLayoutForStrip();
    } catch(e) {}
  }

  function adjustLayoutForStrip() {
    const stripH = document.getElementById('match-strip').offsetHeight;
    document.querySelector('.layout').style.top = stripH + 'px';
  }

  const mapStyle = 'https://basemaps.cartocdn.com/gl/positron-gl-style/style.json';
  const mapCenter = [-77.04, 38.905];

  desktopMap = new maplibregl.Map({ container: 'map', style: mapStyle, center: mapCenter, zoom: 11.5 });
  desktopMap.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'top-right');
  desktopMap.touchZoomRotate.disableRotation();
  desktopMap.on('load', () => { if (!venuesLoaded) loadVenues(); });

  mobileMap = new maplibregl.Map({ container: 'map-mobile', style: mapStyle, center: [-77.06, 38.91], zoom: 10 });
  mobileMap.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'top-right');
  mobileMap.touchZoomRotate.disableRotation();
  mobileMap.on('load', () => { if (!venuesLoaded) loadVenues(); });

  document.getElementById('popup-close').addEventListener('click', clearSelection);
  document.getElementById('detail-close').addEventListener('click', hideDetail);

  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll(`.filter-btn[data-filter="${btn.dataset.filter}"]`).forEach(b => b.classList.add('active'));
      document.querySelectorAll(`.filter-btn:not([data-filter="${btn.dataset.filter}"])`).forEach(b => b.classList.remove('active'));
      activeFilter = btn.dataset.filter;
      clearSelection();
      hideDetail();
      renderMarkers();
      renderLists();
    });
  });
</script>
</body>
</html>
